<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0F1217">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="카운트인">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>카운트인</title>
<style>
:root{
  --ink:#0F1217; --panel:#171B22; --raise:#20252F; --line:#2D3340;
  --text:#ECE7DC; --mute:#959CAA; --dim:#5F6676;
  --beat:#F2A93B; --down:#FF6A55; --cue:#71C6B9;
  --f-num:"SF Pro Display","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--beat);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.scr{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:var(--st) max(0px,var(--sr)) var(--sb) max(0px,var(--sl))}

/* ---------- 목록 ---------- */
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 12px 10px}
.lh .slpick{flex:1}
.slpick{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
.slpick .d{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.06em}
.slpick .n{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.lh-r{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.pill[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.icbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.sl{list-style:none;margin:0;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sl li{display:flex;align-items:stretch;background:var(--raise);border-radius:14px;overflow:hidden}
.sl .row{flex:1;min-width:0;display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 6px 12px 14px;text-align:left}
.sl .i{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.sl .mid{display:flex;flex-direction:column;min-width:0}
.sl .tt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .mm{font-family:var(--f-mono);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sl .b{font-family:var(--f-num);font-weight:800;font-size:32px;line-height:1;text-align:right}
.sl .b small{display:block;font-family:var(--f-mono);font-weight:400;font-size:9px;color:var(--mute);letter-spacing:.1em}
.sl .more{width:52px;color:var(--mute);flex:none;display:flex;align-items:center;justify-content:center}
.sl,.pl{position:relative}
.sl li.tip,.pl li.tip{display:block;background:none;text-align:center;font-size:12px;color:var(--dim);padding:6px 0 2px;border:0}
li.dragging{position:relative;z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.55);outline:2px solid var(--beat)}
.sorting li:not(.dragging){transition:none}
/* ---------- 홈 ---------- */
.hh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 16px 4px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--down);box-shadow:0 0 12px var(--down)}
.hsub{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.1em;padding:12px 18px 6px}
.pl{list-style:none;margin:0;padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pl li{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pcard{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:16px;text-align:left}
.pcard .pn{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pm{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.pcard .bpms{font-family:var(--f-num);font-weight:800;font-size:22px;color:var(--beat);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .bpms small{font-family:var(--f-mono);font-weight:400;font-size:10px;color:var(--mute);margin-left:4px}
.pact{display:flex;flex-direction:column;border-left:1px solid var(--line);flex:none}
.pact button{flex:1;width:58px;display:flex;align-items:center;justify-content:center}
.pact .pplay{font-size:20px;color:var(--beat)}
.pact .more{font-size:22px;color:var(--mute);border-top:1px solid var(--line)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);text-align:center;padding:24px}
.empty b{color:var(--text);font-size:18px}
.lf{display:flex;gap:10px;padding:10px 12px 14px}
.go{flex:1;border-radius:16px;background:var(--beat);color:var(--ink);font-weight:700;font-size:17px;padding:16px 0}
.add{width:58px;border-radius:16px;border:1px solid var(--line);font-size:26px}

/* ---------- 플레이 ---------- */
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px 4px}
.back{font-size:15px;color:var(--mute);padding:8px 6px;flex:none}
.ph-mid{flex:1;min-width:0;text-align:left}
.ph-mid .t{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-mid .sub{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.vwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 10px}
.memo{align-self:flex-start;margin:4px 2px 6px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--text);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;flex:1;min-height:150px;display:flex}
.viz{position:relative;flex:1;min-width:0;border-radius:22px;background:var(--raise);overflow:hidden;touch-action:pan-y}
.sheetbox{flex:1;min-width:0;border-radius:14px;background:var(--raise);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.sheetbox{touch-action:pan-y pinch-zoom}
.pages{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:40vh}
.pg{display:flex;align-items:center;justify-content:center;width:100%}
.pg canvas{display:block;background:#fff}
.pgin{position:relative;flex:none}
.pgin canvas.mk{position:absolute;inset:0;width:100%;height:100%;background:none;pointer-events:none}
.marking .sheetbox{touch-action:none;overflow:hidden}
.marking .pgin canvas.mk{pointer-events:auto;touch-action:none;cursor:crosshair}
.marking .pgnav,.marking .barno{display:none}
.mkbar{position:absolute;left:0;right:0;top:var(--st);z-index:13;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px max(10px,var(--sr)) 8px max(10px,var(--sl));background:rgba(15,18,23,.95);border-bottom:1px solid var(--line)}
.mkbar button{height:40px;min-width:40px;border-radius:10px;border:1px solid var(--line);font-size:16px;padding:0 10px}
.mkbar button[aria-pressed="true"]{border-color:var(--beat);background:var(--raise)}
.mkbar .done{margin-left:auto;background:var(--beat);color:var(--ink);border-color:var(--beat);font-weight:700}
.mkbar .sw-c{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.mkbar .sw-c i{width:20px;height:20px;border-radius:50%;display:block}
.txtdlg{position:fixed;left:max(12px,var(--sl));right:max(12px,var(--sr));top:calc(var(--st) + 64px);z-index:26;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-width:520px;margin:0 auto}
.txtdlg .row2 button{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 0}
.busy{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:15px;text-align:center;padding:24px}
/* 쪽 맞춤: 한 화면에 한 쪽(가로면 두 쪽), 옆으로 밀어 넘김 */
.sheetbox.fitpage{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x pinch-zoom}
.sheetbox.fitpage{scrollbar-width:none}
.sheetbox.fitpage::-webkit-scrollbar{display:none}
.fitpage .pages{flex-direction:row;align-items:stretch;gap:0;padding:0;height:100%}
.fitpage .pg{flex:none;height:100%}
.fitpage .pg.snap{scroll-snap-align:start}
/* 악보 전체 화면: 조작 막대는 탭하면 위아래로 떠요 */
.sheeton .ph,.sheeton .side,.sheeton .dots{display:none}
.sheeton .vwrap{padding:0}
.sheeton .stage{min-height:0}
.sheeton .sheetbox{border-radius:0}
.scr.sheeton.ui .ph{display:flex;position:absolute;left:0;right:0;top:var(--st);z-index:12;background:rgba(15,18,23,.94);border-bottom:1px solid var(--line);padding:8px max(10px,var(--sl)) 8px max(10px,var(--sr))}
.scr.sheeton.ui .side{display:flex;position:absolute;left:max(8px,var(--sl));right:max(8px,var(--sr));bottom:calc(var(--sb) + 8px);z-index:12;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;
  background:rgba(23,27,34,.96);border:1px solid var(--line);border-radius:20px;padding:6px 10px;width:auto;max-width:none;overflow:visible}
.scr.sheeton.ui .bpmrow{padding:0;gap:8px}
.scr.sheeton.ui .bpmbox .big{font-size:40px}
.scr.sheeton.ui .rbtn{width:56px;height:56px;font-size:24px}
.scr.sheeton.ui .ctrl{padding:4px 0;gap:4px}
.scr.sheeton.ui .ctrl > button{font-size:0;min-width:56px}
.scr.sheeton.ui .ctrl .main{width:64px;height:64px}
.scr.sheeton.ui .savebpm{bottom:-16px}

#pgFit{font-size:13px;width:auto;padding:0 10px;border-radius:999px}
.pgside{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:96px;border-radius:14px;background:rgba(15,18,23,.28);color:rgba(236,231,220,.85);font-size:30px;z-index:3;display:none;align-items:center;justify-content:center}
.pgside:active{background:rgba(15,18,23,.6)}
.pgside.l{left:max(4px,var(--sl))} .pgside.r{right:max(4px,var(--sr))}
.sheeton .pgside{display:flex}
.nobtns .pgside{display:none!important}
.sheetmsg{margin:auto;padding:40px 20px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
.barno{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:2px;background:rgba(15,18,23,.82);border:1px solid var(--line);border-radius:12px;padding:2px;z-index:2}
.barno button{width:34px;height:38px;border-radius:9px;font-size:18px;color:var(--mute)}
.barno .bv{min-width:3ch;text-align:center;line-height:1;padding:0 2px}
.barno .bv b{display:block;font-family:var(--f-num);font-weight:800;font-size:30px}
.barno .bv small{font-family:var(--f-mono);font-size:9px;color:var(--mute);letter-spacing:.1em}
.barno.cnt .bv b{color:var(--cue)}
.sheeton .barno{top:auto;bottom:calc(var(--sb) + 8px);left:max(8px,var(--sl));background:rgba(15,18,23,.6)}
.sheeton .barno .bv b{font-size:24px}
.sheeton .barno button{width:30px;height:32px}
.pgnav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 10px);background:rgba(15,18,23,.55);border-radius:999px;padding:3px 10px;z-index:2;font-family:var(--f-mono);font-size:12px;color:var(--text);pointer-events:none}
.scr.sheeton.ui .pgnav,.scr.sheeton.ui .barno{visibility:hidden}
.edgecv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
#bSheet{font-size:16px}
#bSheet[aria-pressed="true"]{border-color:var(--cue);color:var(--cue)}
.sheeton .modes,.sheeton .nextup,.sheeton .memo{display:none!important}
#bMark{font-size:16px}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vizlbl{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--mute);letter-spacing:.08em;pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 0 2px}
.dots span{flex:0 1 34px;height:10px;border-radius:5px;background:var(--line)}
.dots span.on{background:var(--beat)}
.dots span.on.d{background:var(--down)}
.dots span.d{flex-basis:54px}
.dots.cnt span.on{background:var(--cue)}
.side{display:flex;flex-direction:column}
.bpmrow{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 0 0}
.bpmbox{text-align:center;min-width:3.4ch;position:relative}
.bpmbox .big{font-family:var(--f-num);font-weight:800;font-size:64px;line-height:1}
.bpmbox small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--mute);letter-spacing:.14em}
.savebpm{position:absolute;left:50%;transform:translateX(-50%);bottom:-24px;font-size:11px;color:var(--ink);background:var(--cue);border-radius:999px;padding:2px 10px;white-space:nowrap}
.rbtn{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--ink);font-size:26px;flex:none}
.rbtn:active{background:var(--raise)}
.modes{display:flex;gap:6px;justify-content:center;padding:18px 12px 0;flex-wrap:wrap}
.modes button{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--mute)}
.modes button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.nextup{margin:10px 12px 0;padding:8px 12px;border-radius:12px;background:var(--panel);font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:10px}
.nextup b{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;justify-content:center;gap:12px;align-items:center;padding:12px 8px 12px}
.ctrl > button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mute);min-width:60px;min-height:56px}
.ctrl .ic{font-size:22px;color:var(--text);line-height:1}
.ctrl .main{width:76px;height:76px;border-radius:50%;background:var(--ink);border:2px solid var(--text);color:var(--text);justify-content:center}
.ctrl .main .i{width:30px;height:30px}
.ctrl .snd{margin-left:6px}
.ctrl .snd[aria-pressed="false"] .ic{color:var(--mute)}
.locked .lockable{opacity:.3;pointer-events:none}
#bLock[aria-pressed="true"]{border-color:var(--beat);color:var(--beat)}

@media (orientation:landscape) and (max-height:560px){
  .pbody{flex-direction:row}
  .vwrap{padding:0 6px 8px 12px}
  .side{width:320px;flex:none;justify-content:center;overflow-y:auto}
  .bpmbox .big{font-size:52px}
  .modes{padding-top:12px}
  .ctrl .main{width:64px;height:64px}
}

/* 작은 창: 분할 화면·팝업 창에서 악보 옆에 띄울 때 */
@media (max-width:360px){
  .bpmbox .big{font-size:52px}
  .rbtn{width:44px;height:44px}
  .ctrl > button{min-width:44px}
  .ctrl .main{width:66px;height:66px}
}
@media (max-height:520px) and (max-width:820px), (max-height:380px){
  .ph{padding:4px 8px 0;gap:6px}
  .ph-mid .t{font-size:15px}
  .ph-mid .sub{display:none}
  .back{font-size:13px;padding:4px}
  .ph .icbtn{width:32px;height:32px;font-size:14px}
  .memo,.modes,.nextup,.lockhint,#bTap{display:none!important}
  .pbody{flex-direction:row}
  .vwrap{padding:4px 4px 6px 8px}
  .stage{min-height:60px}
  .viz{border-radius:14px}
  .dots{padding-top:6px}
  .dots span{height:7px}
  .side{width:auto;flex:0 1 auto;max-width:50%;min-width:0;justify-content:center;padding:0 6px 0 2px;overflow:visible}
  .bpmrow{gap:6px;padding:0}
  .bpmbox .big{font-size:38px}
  .rbtn{width:38px;height:38px;font-size:18px}
  .savebpm{bottom:-18px}
  .ctrl{padding:6px 0 4px;gap:2px;justify-content:center}
  .ctrl > button{min-width:40px;font-size:0}
  .ctrl .ic{font-size:20px}
  .ctrl .main{width:52px;height:52px;font-size:20px}
  .barno button{width:28px;height:30px}
  .barno .bv b{font-size:24px}
}
@media (max-height:300px){ .ph{display:none} }

/* ---------- 시트 ---------- */
.shw{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-bottom:var(--kb,0px);transition:padding-bottom .15s}
.sheet{width:100%;max-width:560px;max-height:calc(100% - var(--st) - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-radius:22px 22px 0 0;
  padding:8px max(16px,var(--sl)) calc(20px + var(--sb)) max(16px,var(--sr));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px;position:sticky;top:-8px;background:var(--panel);z-index:1}
.sh-head h2{font-size:17px;margin:0}
.txtbtn{font-size:16px;color:var(--mute);padding:8px 4px}
.txtbtn.strong{color:var(--beat);font-weight:700}
.sh-body{display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > span{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.06em}
.fld input[type=text],.fld input:not([type]),.fld select,.inp{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;width:100%}
.bpmedit{display:flex;align-items:center;gap:8px}
.bpmedit input{width:96px;text-align:center;font-family:var(--f-num);font-weight:800;font-size:34px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px 0}
.bpmedit .rbtn{width:44px;height:44px;font-size:20px}
.tapbtn{flex:1;min-width:0;border:1.5px dashed var(--beat);color:var(--beat);border-radius:12px;padding:10px 6px;font-size:14px}
.tapbtn:active{background:rgba(242,169,59,.15)}
.seg{display:flex;background:var(--ink);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1 1 auto;font-size:14px;padding:8px 6px;border-radius:9px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;padding:2px 0;text-align:left;width:100%}
.tg small{display:block;color:var(--mute);font-size:12px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:left .15s}
.tg[aria-checked="true"] .sw{background:var(--beat)}
.tg[aria-checked="true"] .sw::after{left:21px;background:var(--ink)}
.row2{display:flex;gap:8px;align-items:center}
.row2 > *{flex:1}
.sh-actions{display:flex;gap:8px;padding-top:6px}
.sh-actions button{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 0;font-size:15px}
.danger{color:var(--down)!important;border-color:rgba(255,106,85,.5)!important}
.note{font-size:12px;color:var(--mute);line-height:1.5}
input[type=range]{width:100%;accent-color:var(--beat)}
.slrows{display:flex;flex-direction:column;gap:6px}
.slrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--raise);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.slrow[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--beat)}
.slrow span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--mute);flex:none}
.sec-t{font-size:13px;font-weight:700;color:var(--mute);margin-top:6px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}
.keys kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--text);margin-right:4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb{position:relative;background:#fff;border-radius:8px;overflow:hidden;aspect-ratio:1/1.414;outline:3px solid transparent;outline-offset:1px;max-width:100%}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.thumb .pn{position:absolute;left:4px;bottom:4px;background:rgba(15,18,23,.85);color:var(--text);font-family:var(--f-mono);font-size:11px;border-radius:5px;padding:1px 6px}
.thumb .ord{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--beat);color:var(--ink);font-weight:700;font-size:14px;display:none;align-items:center;justify-content:center}
.thumb.on{outline-color:var(--beat)}
.thumb.on .ord{display:flex}
.thumb .usedby{position:absolute;left:4px;top:4px;background:var(--cue);color:var(--ink);font-size:10px;font-weight:600;border-radius:5px;padding:1px 5px}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) 76px;gap:10px;align-items:center;background:var(--raise);border-radius:12px;padding:8px 10px}
.prow.off{opacity:.45}
.prow .pchk{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.prow .pchk[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.prow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font-size:12px;color:var(--mute)}
.prow small.past{color:var(--cue)}
.prow input{width:100%;text-align:center;font-family:var(--f-num);font-weight:800;font-size:22px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 0}
textarea.inp{min-height:120px;resize:vertical;line-height:1.5;font-size:15px}
.qrbox{align-self:center;background:#fff;border-radius:16px;padding:12px;line-height:0}
.qrbox canvas{width:min(62vw,260px);height:auto;image-rendering:pixelated}
.calviz{position:relative;height:150px;border-radius:16px;background:var(--raise);overflow:hidden}
.calviz canvas{position:absolute;inset:0;width:100%;height:100%}
.caltap{height:120px;border-radius:18px;border:1.5px dashed var(--line);background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;touch-action:none;-webkit-user-select:none;user-select:none}
.caltap.hit{border-color:var(--text);background:var(--raise)}
.calres{font-size:15px;line-height:1.5}
.calres b{font-family:var(--f-num);font-size:20px}
/* 따라가기 화면 (참여자): 조작은 숨기고 박과 역할만 */
.follow .bpmrow .rbtn,.follow #bTap,.follow .savebpm,.follow .bpmbox small{display:none!important}
.follow #bTitle{pointer-events:none}
.follow .bpmbox .big{font-size:40px;color:var(--mute)}
.follow .ph-mid .t{font-size:20px}
#bRole{flex:none;font-size:13px;padding:6px 12px;white-space:nowrap}
.dots span.tg{box-shadow:inset 0 0 0 2px var(--text)}
.rolecard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--raise);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;width:100%}
.rolecard[aria-pressed="true"]{border-color:var(--text)}
.rolecard b{font-size:17px}
.rolecard small{font-size:13px;color:var(--mute);line-height:1.5}
/* 리더 큐 카드 */
.cuerow{display:none;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 8px 0}
.leading .cuerow{display:flex}
.cuerow button{height:48px;min-width:72px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:15px}
.cuerow button:active{background:var(--text);color:var(--ink)}
.cuecard{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:14;background:var(--text);color:var(--ink);font-size:clamp(40px,13vw,88px);font-weight:900;letter-spacing:-.02em;padding:16px 36px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;animation:cuepop .25s ease-out}
@keyframes cuepop{from{transform:translate(-50%,-50%) scale(.7);opacity:.3}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cuecard{animation:none}}
#bCheck{display:none}
.follow #bCheck{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 18px;border:1px solid var(--line);border-radius:14px;font-weight:700;font-size:15px}
.chkcells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.chkcell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.chkcell i{width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;font-weight:800;background:var(--raise);border:1.5px solid var(--line);color:var(--mute)}
.chkcell.ok i{background:var(--text);border-color:var(--text);color:var(--ink)}
.chkcell.early i,.chkcell.late i{border-color:var(--text);color:var(--text)}
.chkhead{font-size:20px;font-weight:800;line-height:1.35}
.chktip{font-size:15px;color:var(--text);line-height:1.55}
.chkms{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.librow{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:12px;padding:10px 12px}
.librow .nm{flex:1;min-width:0}
.librow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.librow .nm small{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.librow button{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}

/* ---------- 탭 패드 ---------- */
.tpad{position:fixed;inset:0;z-index:25;background:var(--ink);display:flex;flex-direction:column;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.tpad-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.tpad-top h2{font-size:16px;margin:0;color:var(--mute);font-weight:600}
.tpad-top .txtbtn{padding:10px 8px}
.tpad-area{flex:1;margin:16px 12px 12px;border-radius:26px;background:var(--panel);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;-webkit-user-select:none;user-select:none;position:relative;overflow:hidden}
.tpad-area.hit{background:var(--raise);border-color:var(--beat)}
.tpad-bpm{font-family:var(--f-num);font-weight:800;font-size:clamp(84px,26vw,160px);line-height:1;color:var(--text)}
.tpad-bpm.dim{color:var(--dim)}
.tpad-st{font-size:15px;color:var(--mute);text-align:center;padding:0 16px}
.tpad-st b{color:var(--cue);font-weight:600}
.tpad-st b.warn{color:var(--beat)}
.tpad-hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;color:var(--dim);pointer-events:none}
.tpad-dots{display:flex;gap:6px}
.tpad-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tpad-dots i.on{background:var(--beat)}
.bands{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sb));z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:calc(100% - 24px);pointer-events:none}
.bands.top{top:calc(var(--st) + 68px);bottom:auto}
.band{pointer-events:auto;background:var(--raise);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:100%}
.band span{min-width:0}
.band button{font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 4px;flex:none}
/* 아이콘: 선 2px, currentColor */
.i{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icbtn .i{width:22px;height:22px}
/* 길게 누르기 진행 고리 */
.holdring{position:relative}
.holdring::after{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--text) var(--hp,0%),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
.lockband{text-align:center;font-size:14px;color:var(--text);background:var(--raise);border-bottom:1px solid var(--line);padding:6px 12px}
.sheeton .lockband{position:absolute;left:0;right:0;top:var(--st);z-index:12}
.scr.sheeton.ui .lockband{top:calc(var(--st) + 58px)}
.sheetctl{display:none;gap:8px;width:100%;justify-content:center}
.scr.sheeton.ui .sheetctl{display:flex}
.sheetctl button{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.tapbtn2{height:56px;min-width:56px;border-radius:16px;border:1px solid var(--line);background:var(--ink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute);padding:0 10px;flex:none}
.tapbtn2 .i{color:var(--text)}

:root{--panel:#171B22;--raise:#232934;--line:#3A4150;--lw:1px;--press:2px solid #07080B;--danger:#F08A7E;--ok:#9CCB8A;
  --f-num:"CountNum","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
:root[data-light="1"]{--line:#59606F;--lw:2px;--mute:#B3B9C5;--dim:#8A91A0}
@media (prefers-contrast:more){:root{--line:#59606F;--lw:2px;--mute:#B3B9C5;--dim:#8A91A0}}
button:focus-visible,input:focus-visible{outline-color:var(--text)}
/* 색은 박만 낸다: 버튼·선택·토글은 크림/무채색 */
.go{background:var(--text);color:var(--ink);border-radius:12px;font-size:16px;min-height:56px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px}
.add{border:var(--lw) solid var(--line);border-radius:12px;min-height:56px;width:56px;flex:none}
.pill{border:var(--lw) solid var(--line);min-height:40px;font-weight:600}
.icbtn{width:48px;height:48px;border:var(--lw) solid var(--line)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border:var(--lw) solid var(--line);border-radius:12px;font-weight:600;font-size:14px;color:var(--text);flex:none;white-space:nowrap}
.btn2 .i{width:20px;height:20px}
.seg{border:var(--lw) solid var(--line);border-radius:999px;background:var(--ink)}
.seg button{border-radius:999px;min-height:44px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink);box-shadow:none;font-weight:700}
.tg[aria-checked="true"] .sw{background:var(--text)}
.txtbtn{min-height:48px;font-weight:600}
.txtbtn.strong{color:var(--text)}
.fld > span{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:0;color:var(--mute)}
.fld input[type=text],.fld input:not([type]),.fld select,.inp{border:var(--lw) solid var(--line);min-height:48px}
.bpmedit input{border:var(--lw) solid var(--line)}
.bpmedit .rbtn{border-radius:12px;background:var(--raise);border:var(--lw) solid var(--line);border-bottom:var(--press)}
.tapbtn{border:var(--lw) solid var(--line);color:var(--text);font-weight:600}
.tapbtn:active{background:var(--raise)}
input[type=range]{accent-color:var(--text)}
.savebpm{background:var(--ink);border:1px solid var(--text);color:var(--text);font-weight:600;z-index:2}
.thumb.on{outline-color:var(--text)}
.thumb .ord{background:var(--text)}
.thumb .usedby{background:var(--raise);color:var(--text);border:1px solid var(--line)}
.prow small.past,.tpad-st b,.tpad-st b.warn{color:var(--text)}
.mkbar .done{background:var(--text);border-color:var(--text);color:var(--ink)}
.mkbar button[aria-pressed="true"]{border-color:var(--text)}
.tpad-area.hit{border-color:var(--text)}
.slrow[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--text)}
li.dragging{outline-color:var(--text)}
#bLock[aria-pressed="true"]{border-color:var(--text);color:var(--text);background:var(--raise)}
#bSheet[aria-pressed="true"]{border-color:var(--text);color:var(--ink);background:var(--text)}
.sheet{background:var(--panel);border-top:var(--lw) solid var(--line);border-radius:24px 24px 0 0}
.sh-head h2{font-size:20px;font-weight:700}
.sh-body{gap:20px}
.librow,.slrow,.prow{background:var(--ink);border:var(--lw) solid var(--line)}
.librow button{border:var(--lw) solid var(--line)}
.danger{color:var(--danger)!important;border-color:var(--line)!important}
.sec-t{font-size:13px;font-weight:600}
.note{font-size:13px}
.band{border:var(--lw) solid var(--line)}
.rolecard{background:var(--ink);border:var(--lw) solid var(--line);border-radius:12px}
.rolecard[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.rolecard[aria-pressed="true"] small{color:#3A4150}
.songpick{display:flex;flex-direction:column;gap:8px}
.songpick button{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:60px;padding:0 14px;border:var(--lw) solid var(--line);border-radius:12px;background:var(--ink);text-align:left}
.songpick button[aria-current="true"]{border-color:var(--text);background:var(--raise)}
.songpick .n{font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--mute)}
.songpick [aria-current="true"] .n{color:var(--text)}
.songpick .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songpick .t small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:2px}
.songpick .b{font-family:var(--f-num);font-weight:800;font-size:28px}
.visgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.visgrid .rolecard{padding:12px 14px}
.txtdlg .ok{background:var(--text);color:var(--ink);font-weight:700;border-color:var(--text)!important}
/* 재생 중에 여는 시트는 반만, 배경은 어둡게 하지 않음 (박이 계속 보이게) */
.shw.onplay{background:none}
.shw.onplay .sheet{max-height:58%;animation:fadein .16s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- 홈 ---------- */
.hh{padding:24px 16px 4px}
.brand{font-size:28px;font-weight:800;letter-spacing:-.02em}
.brand i{display:none}
.hsub{font-family:var(--f-body);letter-spacing:0;font-size:13px;font-weight:600;padding:16px 16px 8px}
.pl li{position:relative;background:var(--panel);border:var(--lw) solid var(--line);border-radius:12px}
.pl li.cur::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--text)}
.pl li.tip{border:0;background:none}
.pcard{gap:4px}
.pcard .pn{font-size:20px}
.pcard .pm{font-family:var(--f-body);font-size:13px}
.pcard .bpms{color:var(--text);font-size:28px;font-weight:700;margin-top:2px}
.pact{border-left:0;justify-content:center;padding-right:14px}
.pact .pplay{flex:none;width:56px;height:56px;border-radius:50%;border:var(--lw) solid var(--line);color:var(--text)}
.pl li.cur .pact .pplay{background:var(--text);color:var(--ink);border-color:var(--text)}
.homehint{margin:0 12px 4px;padding:10px 6px;font-size:15px;color:var(--mute);line-height:1.5;text-align:left}
.homehint b{color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- 콘티 (곡 목록) ---------- */
.lh{flex-wrap:wrap;row-gap:6px;padding:12px 12px 8px}
.lh .back{order:1}
.lh .lh-r{order:2;margin-left:auto}
.lh .slpick{order:3;flex-basis:100%;padding:0 4px}
.lh .slpick .d{display:none}
.lh .slpick .n{font-size:28px;font-weight:800;letter-spacing:-.02em;max-width:100%;white-space:normal;line-height:1.25}
.lh .slpick .s{font-size:15px;color:var(--mute)}
.sl li{background:var(--panel);border:var(--lw) solid var(--line);border-radius:12px;position:relative}
.sl li.cur{border-color:var(--text);background:var(--raise)}
.sl li.cur .i{color:var(--text)}
.sl li.tip{border:0;background:none}
.sl .row{grid-template-columns:24px minmax(0,1fr) auto;min-height:68px}
.sl .i{font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--mute)}
.sl .tt{font-size:16px}
.sl .mm{font-family:var(--f-body);font-size:13px;display:flex;gap:8px;align-items:center;margin-top:4px}
.sl .mm .mt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .b{font-size:30px}
.sl .b small{display:none}
.sl .more{width:48px}
.mini{display:inline-flex;gap:3px;flex:none;align-items:center}
.mini i{width:8px;height:8px;border:1.5px solid var(--mute);border-radius:2px;box-sizing:border-box}
.mini i.d{width:12px;border-color:var(--down)}
.mini i.g{margin-left:4px}

/* ---------- 재생 ---------- */
.ph{gap:8px}
.ph-mid .t{font-size:20px}
.ph-mid .sub{font-family:var(--f-body);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:15px;font-weight:600;min-height:48px}
.memo{font-size:13px;font-weight:600;border:var(--lw) solid var(--line);border-radius:999px;padding:5px 12px}
.viz{background:var(--panel);border:var(--lw) solid var(--line);border-radius:24px}
.vischip{position:absolute;left:12px;top:12px;z-index:2;height:36px;padding:0 10px 0 14px;display:flex;align-items:center;gap:4px;border:var(--lw) solid var(--line);border-radius:999px;background:var(--ink);font-size:13px;font-weight:600;color:var(--text)}
.vischip .i{width:16px;height:16px;color:var(--mute)}
.follow .vischip{display:none}
.barno{left:auto;right:8px}
.vizlbl{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--mute);letter-spacing:0;top:18px}
/* 박 램프 줄: 꺼진 칸도 테두리, 첫 칸은 넓고 빨간 테두리, 카운트인 중엔 칸만 청록 */
.dots{gap:14px;padding:12px 0 2px;align-items:flex-start}
.dots.many{gap:8px}
.dots span{flex:none;height:auto;background:none!important;border-radius:0;box-shadow:none!important;display:flex;flex-direction:column;align-items:center;gap:4px}
.dots span,.dots span.d,.dots span.tg{flex:none;width:auto;padding:0;justify-content:flex-start;font-size:inherit;text-align:center}
.dots span i{display:block;width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(236,231,220,.6);box-sizing:border-box}
:root[data-light="1"] .dots span i{border-color:rgba(236,231,220,.9);border-width:2px}
.dots span.d i{width:21px;border-color:var(--down)}
.dots span.g{margin-left:8px}
.dots span em{font-style:normal;font-family:var(--f-num);font-weight:700;font-size:13px;line-height:1;color:var(--mute)}
.dots span.on i{background:var(--beat);border-color:var(--beat)}
.dots span.on.d i{background:var(--down);border-color:var(--down)}
.dots.cnt span.on i{background:var(--cue);border-color:var(--cue)}
.dots span.on em{color:var(--text)}
.follow .dots span:not(.tg) i{width:10px;height:10px;margin:5px 0;border-radius:50%;border:0;background:var(--dim)!important}
.follow .dots span.on:not(.tg) i{background:var(--text)!important}
.dots span.tg i{width:20px;height:20px;border-radius:6px;border:2px solid var(--text)}
/* BPM: − 숫자 + 를 한 알약으로 */
.bpmrow{padding:10px 0 0;gap:12px}
.bpmgrp{display:flex;align-items:stretch;border:var(--lw) solid var(--line);border-radius:999px;background:var(--panel)}
.bpmgrp .rbtn{width:64px;height:auto;min-height:64px;border:0;border-bottom:var(--press);background:var(--raise);font-size:28px}
.bpmgrp .rbtn:first-child{border-radius:999px 0 0 999px}
.bpmgrp .rbtn:last-child{border-radius:0 999px 999px 0}
.bpmgrp .rbtn:active{transform:translateY(1px)}
.bpmbox{padding:4px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.bpmbox .big{font-size:60px;line-height:1}
.bpmbox small{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:0}
.bpmbox .savebpm{bottom:-20px}
.follow .bpmgrp{border:0;background:none}
.follow .bpmbox .big{color:var(--text);font-size:44px}
/* 다음 곡 줄 (두드려 재기 · 박 체크는 여기) */
.nextup{margin:14px 12px 0;padding:10px 2px 0;background:none;border-radius:0;border-top:var(--lw) solid var(--line);align-items:center;font-size:15px}
.nextup .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextup .nx b{color:var(--text);font-weight:600}
.nextup .nx .num{font-family:var(--f-num);font-weight:700;font-size:17px}
#bCheck{display:none}
.follow #bCheck{display:inline-flex;height:44px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:600}
.follow #bTap{display:none!important}
/* 트랜스포트: 이전·다음은 눌리는 키, 시작은 크림 원(재생 중엔 테두리만) */
.ctrl{gap:16px;padding:14px 8px 16px}
.ctrl > button{min-width:0}
.ctrl > #bPrev,.ctrl > #bNext{width:56px;height:56px;min-height:56px;border-radius:12px;background:var(--raise);border:var(--lw) solid var(--line);border-bottom:var(--press);font-size:0}
.ctrl > #bPrev:active,.ctrl > #bNext:active{transform:translateY(2px)}
.ctrl .main{width:76px;height:76px;background:var(--text);color:var(--ink);border:2px solid var(--text);gap:2px}
.ctrl .main .i{width:26px;height:26px}
.ctrl .main span{font-size:12px;font-weight:700;line-height:1}
.ctrl .main.on{background:none;color:var(--text)}
.ctrl .snd{width:48px;height:48px;min-height:48px;border-radius:50%;border:var(--lw) solid var(--line);font-size:0;margin-left:4px}
.ctrl .snd[aria-pressed="false"]{border-style:dashed}
.scr.sheeton.ui .bpmgrp .rbtn{min-height:52px;width:52px}
.scr.sheeton.ui .ctrl .main{width:64px;height:64px}
.scr.sheeton.ui .ctrl > #bPrev,.scr.sheeton.ui .ctrl > #bNext{width:52px;height:52px;min-height:52px}
.sheeton .vischip{display:none}
@media (orientation:landscape) and (max-height:560px){ .bpmgrp .rbtn{min-height:56px;width:56px} .bpmbox .big{font-size:48px} .nextup{margin-top:8px} .ctrl{padding:10px 8px} }
@media (max-width:360px){ .bpmgrp .rbtn{width:52px;min-height:56px} .bpmbox{padding:4px 10px} .ctrl{gap:10px} }
@media (max-height:520px) and (max-width:820px), (max-height:380px){
  .bpmgrp .rbtn{width:40px;min-height:40px;font-size:18px} .bpmbox{padding:2px 8px} .bpmbox .big{font-size:34px}
  .ctrl > #bPrev,.ctrl > #bNext{width:44px;height:44px;min-height:44px} .ctrl .main{width:52px;height:52px} .ctrl .main span{display:none} .ctrl .snd{width:40px;height:40px;min-height:40px}
  .dots span em{display:none} .vischip{height:30px;top:6px;left:6px}
}

/* ---------- 아이패드: 같은 부품을 다시 배치 (compact <700 / regular 700~1099 / wide ≥1100) ---------- */
/* 가로 아이패드: BPM과 재생 키를 한 줄로 */
body[data-lay="wide"] .side{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:0 20px 8px;column-gap:16px}
body[data-lay="wide"] .nextup{order:-1;flex-basis:100%;margin:12px 0 0}
body[data-lay="wide"] .bpmrow{padding:14px 0 6px}

body[data-lay="wide"] .bpmgrp .rbtn{min-height:68px}

body[data-lay="regular"] .ph,body[data-lay="wide"] .ph{padding:16px 20px 8px}
body[data-lay="regular"] .vwrap,body[data-lay="wide"] .vwrap{padding:0 20px}
body[data-lay="regular"] .ph-mid .t,body[data-lay="wide"] .ph-mid .t{font-size:28px;font-weight:800;letter-spacing:-.02em}
body[data-lay="regular"] .bpmbox .big,body[data-lay="wide"] .bpmbox .big{font-size:clamp(60px,7vw,96px)}
body[data-lay="regular"] .dots span i,body[data-lay="wide"] .dots span i{width:20px;height:20px}
body[data-lay="regular"] .dots span.d i,body[data-lay="wide"] .dots span.d i{width:30px}
body[data-lay="regular"] .dots,body[data-lay="wide"] .dots{gap:18px;padding-top:16px}
body[data-lay="regular"] .ctrl .main,body[data-lay="wide"] .ctrl .main{width:84px;height:84px}
body[data-lay="regular"] .ctrl > #bPrev,body[data-lay="regular"] .ctrl > #bNext,body[data-lay="wide"] .ctrl > #bPrev,body[data-lay="wide"] .ctrl > #bNext{width:64px;height:64px;min-height:64px}
body[data-lay="regular"] .nextup,body[data-lay="wide"] .nextup{margin:16px 20px 0}
body[data-lay="regular"] .pl,body[data-lay="wide"] .pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-content:start;padding:4px 16px 12px}
body[data-lay="regular"] .pl li.tip,body[data-lay="wide"] .pl li.tip{grid-column:1/-1}
body[data-lay="regular"] #scrHome .lf,body[data-lay="wide"] #scrHome .lf{width:100%;max-width:520px;margin:0 auto}
body[data-lay="regular"] .homehint,body[data-lay="wide"] .homehint{text-align:center}
/* 아이패드 시트: 오른쪽 420px 패널 */
body[data-lay="regular"] .shw,body[data-lay="wide"] .shw{justify-content:flex-end;align-items:stretch;background:rgba(5,6,8,.35)}
body[data-lay="regular"] .shw.onplay,body[data-lay="wide"] .shw.onplay{background:none}
body[data-lay="regular"] .sheet,body[data-lay="wide"] .sheet{max-width:420px;max-height:none!important;height:100%;border-radius:24px 0 0 24px;border-top:0;border-left:var(--lw) solid var(--line);animation:slidein .16s ease-out;padding-top:calc(var(--st) + 12px);box-shadow:-10px 0 40px rgba(0,0,0,.45)}
body[data-lay="regular"] .grab,body[data-lay="wide"] .grab{display:none}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
/* 가로 넓은 화면: 악보는 박 화면 옆 칸 (박 비주얼과 같이 보임) */
#scrPlay.sheetside .stage{gap:12px}
#scrPlay.sheetside .sheetbox{flex:0 0 46%;border-radius:16px;border:var(--lw) solid var(--line)}
#scrPlay.sheetside .pgside{display:flex}
#scrPlay.sheetside .pgside.l{left:calc(54% + 6px)}
#scrPlay.sheetside .sheetctl{display:flex;padding:0 0 10px}
#scrPlay.sheetside .pgnav{left:auto;right:12px;transform:none}
#scrPlay.sheetside .barno{right:calc(46% + 20px)}
@media (prefers-reduced-motion:reduce){.shw.onplay .sheet,body[data-lay] .sheet{animation:none}}
</style>

// 두드린 시각들 → BPM. 중앙값에서 크게 벗어난 간격(놓친 박·두 번 누름)은 빼고, 두 박 간격은 반으로 나눠 씀
function tapBpm(ts) {
  const iv = [];
  for (let i = 1; i < ts.length; i++) iv.push(ts[i] - ts[i - 1]);
  if (iv.length < 2) return null;
  const sorted = [...iv].sort((a, b) => a - b), med = sorted[sorted.length >> 1];
  const ok = [];
  iv.forEach(x => {
    if (Math.abs(x - med) <= med * .2) ok.push(x);
    else if (Math.abs(x / 2 - med) <= med * .15) ok.push(x / 2);
  });
  if (ok.length < 2) return null;
  const mean = ok.reduce((a, b) => a + b, 0) / ok.length;
  const sd = Math.sqrt(ok.reduce((a, b) => a + (b - mean) ** 2, 0) / ok.length);
  return {bpm:clamp(Math.round(60000 / mean), 20, 300), cv:sd / mean, used:ok.length, dropped:iv.length - ok.length};
}

const IDB = {

  },

    const db = await this.open();
    return new Promise((res, rej) => { const q = fn(db.transaction('sheets', mode).objectStore('sheets')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },

  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },

};
// 악보함에 없는 PDF 파일 지우기
async function gcSheets() {

}

function getDoc(key) {
  if (!DOCS.has(key)) DOCS.set(key, (async () => {
    const buf = await IDB.get(key);
    if (!buf) throw new Error('missing');
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({data:new Uint8Array(buf)}).promise;
    const L = D.library.find(x => x.key === key);
    if (L && L.pages !== doc.numPages) { L.pages = doc.numPages; save(); }
    return doc;
  })().catch(e => { DOCS.delete(key); throw e; }));
  return DOCS.get(key);
}
// PDF 파일을 악보함에 넣기. 성공하면 악보함 항목을 돌려줌
async function addPdf(f) {
  if (f.type && f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) { toast('PDF 파일만 넣을 수 있어요'); return null; }
  toast('PDF 읽는 중…');
  const buf = await f.arrayBuffer();
  let doc;
  try { const lib = await loadPdfJs(); doc = await lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise; }
  catch (e) { toast('이 PDF는 열 수 없어요'); return null; }
  const key = 'pdf_' + uid();
  try { await IDB.put(key, buf); } catch (e) { toast('PDF를 저장하지 못했어요 (저장 공간 확인)'); return null; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const entry = {key, name:f.name.replace(/\.pdf$/i, ''), pages:doc.numPages};
  D.library.push(entry); save();
  DOCS.set(key, Promise.resolve(doc));
  toast(`"${entry.name}" ${entry.pages}쪽을 악보함에 넣었어요`);

function updPg() {

    box.scrollTo({left:clamp(Math.round(box.scrollLeft / W + d) * W, 0, max), behavior:'smooth'});
    return true;
  }

// li[data-i]를 0.38초 누르고 있으면 들려서 따라오고, 놓으면 onDrop(새 순서의 원래 번호 배열)
function sortable(ul, onDrop) {
  let st = null, suppress = false;
  const items = () => [...ul.children].filter(x => x.dataset.i !== undefined);
  const cancel = () => { if (st) clearTimeout(st.timer); st = null; };
  ul.addEventListener('pointerdown', e => {
    const li = e.target.closest('li[data-i]');
    if (!li || e.button > 0 || items().length < 2) return;
    st = {li, x0:e.clientX, y0:e.clientY, y:e.clientY, pid:e.pointerId, dragging:false};

    if (!st || !st.dragging) return;

    requestAnimationFrame(auto);
  }
  ul.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.pid) return;
    st.y = e.clientY;
    if (!st.dragging) { if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) > 8) cancel(); return; }

    if (!st) return;

      st.li.classList.remove('dragging'); st.li.style.transform = ''; ul.classList.remove('sorting');

const PK = {key:null, sel:[], n:0, tok:0, imp:false};

let edScroll = 0;

// 같은 콘티에서 이 PDF의 각 쪽을 쓰는 다른 곡 번호
function usedBy(key) {

  curSL().songs.forEach((s, j) => {
    if (j === draftIdx || !s.sheet) return;
    s.sheet.items.forEach(it => {
      if (it.key !== key) return;

const selCount = sel => sel.reduce((a, it) => a + (it.page ? 1 : ((libOf(it.key) || {}).pages || 1)), 0);

async function renderThumbs() {
  const tok = ++PK.tok, box = $('#thumbs');
  let doc;
  try { doc = await getDoc(PK.key); }
  catch (e) { if (tok === PK.tok && $('#pkInfo')) $('#pkInfo').textContent = e.message === 'missing' ? '이 기기에 이 PDF 파일이 없어요. 새로 넣어 주세요.' : 'PDF를 열지 못했어요.'; return; }
  if (tok !== PK.tok || !box.isConnected) return;
  PK.n = doc.numPages;
  // "전체 쪽"(page 0)은 낱장으로 펼쳐서 하나씩 뺄 수 있게
  const k0 = PK.sel.findIndex(it => it.key === PK.key && !it.page);
  if (k0 >= 0) PK.sel.splice(k0, 1, ...Array.from({length:PK.n}, (_, i) => ({key:PK.key, page:i + 1})));
  const seen = new Set();
  PK.sel = PK.sel.filter(it => { if (it.key !== PK.key) return true; if (it.page > PK.n || seen.has(it.page)) return false; seen.add(it.page); return true; });
  const used = usedBy(PK.key);
  box.innerHTML = Array.from({length:PK.n}, (_, i) => `<button type="button" class="thumb" data-act="pkTog" data-p="${i + 1}" aria-label="${i + 1}쪽">
    <canvas></canvas><span class="pn num">${i + 1}</span><span class="ord num"></span>${used[i + 1] ? `<span class="usedby">${used[i + 1].join('·')}번 곡</span>` : ''}</button>`).join('');
  updPick();
  const cvs = [...box.querySelectorAll('canvas')], cw = (cvs[0] ? cvs[0].getBoundingClientRect().width : 100) * Math.min(devicePixelRatio || 1, 2);
  for (let i = 0; i < cvs.length; i++) {
    if (tok !== PK.tok || !box.isConnected) return;
    try {
      const pg = await doc.getPage(i + 1), v1 = pg.getViewport({scale:1}), vp = pg.getViewport({scale:cw / v1.width});
      cvs[i].width = Math.floor(vp.width); cvs[i].height = Math.floor(vp.height);
      await pg.render({canvasContext:cvs[i].getContext('2d'), viewport:vp}).promise;
    } catch (e) {}
  }
}
const pkIdx = p => PK.sel.findIndex(it => it.key === PK.key && it.page === p);
function updPick() {

function parseConti(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/​/g, '').trim()).filter(Boolean);
  const NUM = /^(?:\d{1,2}\s*[.)\]:．、]|[①-⑳]|[-•·*▶►▷○●])\s*/;
  const numbered = lines.some(l => NUM.test(l));
  let header = ''; const items = [];
  lines.forEach((l, i) => {
    const song = numbered ? NUM.test(l) : !(i === 0 && /콘티|예배|주일|찬양|집회|수련회|\d{1,2}\s*[\/.월]\s*\d{1,2}/.test(l));
    if (!song) { if (!header) header = l.replace(/[<>\[\]【】]/g, '').trim().slice(0, 40); return; }
    let t = l.replace(NUM, ''), key = null, bpm = null;
    const km = t.match(/[(\[（]\s*([A-G](?:[#♯b♭])?m?(?:\s*(?:[-→>~/]|에서)\s*[A-G](?:[#♯b♭])?m?)*)\s*(?:key|키)?\s*[)\]）]/i) || t.match(/(?:^|\s)([A-G](?:[#♯b♭])?m?)\s*(?:key|키)(?=\s|$)/i);
    if (km) { key = km[1].replace(/\s+/g, ''); t = t.replace(km[0], ' '); }
    const bm = t.match(/(?:bpm|♩\s*=?|템포)\s*:?\s*(\d{2,3})/i) || t.match(/(\d{2,3})\s*bpm/i) || t.match(/(?:^|\s|[-/·|])(\d{2,3})\s*$/);
    if (bm && +bm[1] >= 30 && +bm[1] <= 260) { bpm = +bm[1]; t = t.replace(bm[0], ' '); }
    t = t.replace(/\s*[-–—|·/]+\s*$/, '').replace(/\s{2,}/g, ' ').trim();

}

H.calCancel = () => { stopCal(); sheetKind = 'settings'; renderSettings(); };

/* ================= 8박 박 체크 (참여자용) ================= */
// 준비 4박 뒤 8박 동안 두드림. 판정은 스피커 지연 보정(visOffset)을 빼고, 결과는 말로 격려 (ms는 '자세히'에서만, 기기 밖으로 안 나감)
const CK = {on:false, t:0, raf:0, start:0, spb:.75, n:0, pre:4, len:8, taps:[], done:false, showMs:false, last:null};
function stopCheck() { CK.on = false; clearInterval(CK.t); cancelAnimationFrame(CK.raf); }
function openCheck() {
  if (E.playing) stop();
  ensureCtx();
  const s = song(), bt = (E.ctx.outputLatency || 0) > .1 && !D.settings.visOffset;
  sheet.innerHTML = `<div class="grab"></div>
  <div class="sh-head"><span></span><h2>박 체크</h2><button class="txtbtn" data-act="close">닫기</button></div>
  <div class="sh-body">
    <p class="note">준비 4박 다음, 8박 동안 소리와 원에 맞춰 아래 칸을 두드려요. 점수가 아니라 감을 잡는 연습이에요. 결과는 이 기기에서 나만 봐요.</p>
    ${bt ? `<div class="librow"><span class="nm"><b>블루투스로 듣고 있나요?</b><small>소리가 늦게 나오면 판정이 틀려져요. 먼저 한 번 맞춰 두세요.</small></span><button type="button" data-act="calOpen">맞추러 가기</button></div>` : ''}
    <div class="calviz" style="height:170px"><canvas id="chkCv"></canvas><div class="vizlbl" id="chkLbl" style="font-size:15px;color:var(--text)"></div></div>
    <div class="caltap" id="chkTap" style="height:140px"><b style="font-size:17px" id="chkTapL">시작을 누르세요</b><span class="num" id="chkCnt" style="color:var(--mute)"></span></div>
    <button type="button" class="go" data-act="chkStart" id="chkGo">시작 · ${P.bpm} BPM</button>
    <div id="chkRes" class="sh-body" style="gap:12px"></div>
  </div>`;
  openSheet('check');
  $('#chkTap').addEventListener('pointerdown', e => { e.preventDefault(); chkTap(e.timeStamp || performance.now()); });
  drawCheck(true);
}
function drawCheck(idle) {
  const cv = $('#chkCv'); if (!cv) return;
  const b = idle ? 0 : (outNow() + FRAME_AHEAD + D.settings.visOffset / 1000 - CK.start) / CK.spb;
  draw(cv, 'approach', b < 0 ? 0 : b, 4, {idle:idle || b < 0, subs:1, loud:true, counting:b < CK.pre, targets:[true, true, true, true]});
  const lbl = $('#chkLbl');
  if (lbl) lbl.textContent = idle || b < 0 ? '' : b < CK.pre ? `준비 ${CK.pre - Math.floor(b)}` : b < CK.pre + CK.len ? `${Math.floor(b) - CK.pre + 1} / ${CK.len}` : '';
}
H.chkStart = () => {
  if (CK.on) return;
  ensureCtx();
  CK.spb = 60 / P.bpm; CK.start = E.ctx.currentTime + .4; CK.n = 0; CK.taps = []; CK.done = false; CK.on = true; CK.showMs = false;
  $('#chkRes').innerHTML = ''; $('#chkGo').disabled = true; $('#chkTapL').textContent = '원이 닿을 때 두드리세요'; $('#chkCnt').textContent = '';
  const total = CK.pre + CK.len;
  CK.t = setInterval(() => {
    if (!CK.on) return;
    while (CK.n < total && CK.start + CK.n * CK.spb < E.ctx.currentTime + .12) {
      const t = CK.start + CK.n * CK.spb; if (t >= E.ctx.currentTime - .005) click(t, CK.n % 4 === 0 ? 2 : 1); CK.n++;
    }
    if (CK.n >= total && E.ctx.currentTime > CK.start + total * CK.spb + .4) { stopCheck(); finishCheck(); }
  }, 25);
  const fr = () => { if (!CK.on) return; drawCheck(false); CK.raf = requestAnimationFrame(fr); };
  CK.raf = requestAnimationFrame(fr);
};
function chkTap(t) {
  if (!CK.on) return;
  const a = $('#chkTap'); a.classList.add('hit'); setTimeout(() => a.classList.remove('hit'), 90);
  // 두드린 순간을 '귀에 들린 박'과 같은 시계로: 스피커 지연(visOffset<0이면 소리가 늦음)만큼 당김
  CK.taps.push(outNow() - (performance.now() - t) / 1000 + D.settings.visOffset / 1000);
  const n = CK.taps.filter(x => x > CK.start + (CK.pre - .5) * CK.spb).length;
  $('#chkCnt').textContent = n ? `${Math.min(n, CK.len)} / ${CK.len}` : '';
}
function finishCheck() {
  const tol = Math.max(.045, CK.spb * .09), used = new Set(), cells = [];
  for (let j = 0; j < CK.len; j++) {
    const bt = CK.start + (CK.pre + j) * CK.spb;
    let best = -1, bd = 1e9;
    CK.taps.forEach((x, i) => { const d = Math.abs(x - bt); if (!used.has(i) && d < CK.spb * .5 && d < bd) { bd = d; best = i; } });
    if (best < 0) { cells.push({c:'miss'}); continue; }
    used.add(best);
    const e = CK.taps[best] - bt;
    cells.push({c:Math.abs(e) <= tol ? 'ok' : e < 0 ? 'early' : 'late', e});
  }
  const ok = cells.filter(c => c.c === 'ok').length, hits = cells.filter(c => c.c !== 'miss');
  const early = cells.filter(c => c.c === 'early').length, late = cells.filter(c => c.c === 'late').length, miss = cells.filter(c => c.c === 'miss').length;
  const mean = hits.length ? hits.reduce((a, c) => a + c.e, 0) / hits.length : 0;
  const prev = D.practice.length ? D.practice[D.practice.length - 1] : null;
  D.practice.push({at:new Date().toISOString().slice(0, 10), bpm:P.bpm, ok, song:(song() || {}).title || ''}); save();
  let head, tip;
  if (ok >= 6) { head = `좋아요! 8박 중 ${ok}박이 딱 맞았어요`; tip = '이 느낌 그대로 들어가면 돼요. 원보다 소리를 더 믿어 봐도 좋아요.'; }
  else if (ok >= 3) { head = `${ok}박이 딱 맞았어요`; tip = early > late ? '조금 서두르는 편이에요. 원이 안쪽 원에 닿을 때까지 한 템포 기다렸다 쳐 보세요.' : late > early ? '살짝 늦게 따라오는 편이에요. 원이 다가오는 걸 보면서 미리 손을 준비해 두세요.' : '박을 잘 따라오고 있어요. 한 번 더 하면 더 맞을 거예요.'; }
  else { head = '괜찮아요, 처음엔 다 그래요'; tip = miss >= 4 ? '두드리는 걸 잊어도 괜찮아요. 소리보다 원이 닿는 순간만 보고 쳐 보세요.' : late >= early + 2 ? '소리를 듣고 따라 치느라 조금씩 늦어요. 원이 다가오는 걸 보면서 닿기 직전에 손을 내려 보세요.' : early >= late + 2 ? '마음이 앞서서 조금씩 빨라요. 원이 안쪽 원에 완전히 닿을 때까지 기다려 보세요.' : '소리를 따라가기보다 원이 닿는 순간에 맞춰 보세요. 몇 번 하면 금방 잡혀요.'; }
  const better = prev && ok > prev.ok ? `<p class="chktip" style="color:var(--cue)">지난번(${prev.ok}박)보다 ${ok - prev.ok}박 더 맞았어요.</p>` : '';
  const mark = {ok:['✓', '맞음'], early:['←', '빠름'], late:['→', '느림'], miss:['·', '놓침']};
  $('#chkRes').innerHTML = `<div class="chkhead">${head}</div>
    <div class="chkcells">${cells.map((c, i) => `<div class="chkcell ${c.c}"><i>${mark[c.c][0]}</i>${i + 1}</div>`).join('')}</div>
    <p class="chktip">${tip}</p>${better}
    <div class="row2"><button type="button" class="pill" data-act="chkMs" style="flex:0 0 auto">자세히</button><span></span></div>
    <div class="chkms" id="chkMs" hidden>${cells.map((c, i) => `${i + 1}박 ${c.c === 'miss' ? '–' : (c.e > 0 ? '+' : '') + Math.round(c.e * 1000) + 'ms'}`).join(' · ')}<br>평균 ${mean > 0 ? '+' : ''}${Math.round(mean * 1000)}ms (−는 빠름, +는 느림) · 맞음 기준 ±${Math.round(tol * 1000)}ms${D.settings.visOffset ? ` · 스피커 보정 ${D.settings.visOffset}ms 반영` : ''}</div>`;
  $('#chkGo').disabled = false; $('#chkGo').textContent = '한 번 더'; $('#chkTapL').textContent = '한 번 더 하려면 아래 버튼'; $('#chkCnt').textContent = '';
  drawCheck(true);
}
H.chkMs = () => { const m = $('#chkMs'); if (m) m.hidden = !m.hidden; };
$('#bCheck').onclick = openCheck;

/* ================= 키보드 ================= */
// 키보드가 화면을 줄여 주지 않는 환경(아이폰 사파리, 일부 안드로이드 앱)에서 키보드 높이만큼 창을 올림
(() => {
  const root = document.documentElement;
  let baseH = innerHeight, nativeKb = 0;
  const set = px => root.style.setProperty('--kb', Math.max(0, Math.round(px)) + 'px');
  const calc = () => {
    const vv = window.visualViewport;
    let kb = vv ? innerHeight - vv.height - vv.offsetTop : 0;
    // 앱 키보드 높이: 화면이 이미 그만큼 줄었으면 빼고
    if (nativeKb) kb = Math.max(kb, nativeKb - Math.max(0, baseH - innerHeight));
    set(kb > 60 ? kb : 0);
  };
  window.addEventListener('resize', () => { if (!nativeKb && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) baseH = innerHeight; calc(); });
  if (window.visualViewport) { visualViewport.addEventListener('resize', calc); visualViewport.addEventListener('scroll', calc); }
  const KB = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Keyboard;
  if (KB) {
    KB.addListener('keyboardDidShow', i => { nativeKb = i.keyboardHeight || 0; calc(); setTimeout(calc, 200); });
    KB.addListener('keyboardDidHide', () => { nativeKb = 0; set(0); });
  }
  // 입력칸을 누르면 창 안에서 그 칸이 보이게
  document.addEventListener('focusin', e => {
    const el = e.target;
    if (!el.matches || !el.matches('input:not([type=range]):not([type=file]),textarea')) return;
    setTimeout(() => { calc(); try { el.scrollIntoView({block:'center', behavior:'smooth'}); } catch (err) {} }, 320);
  });
  document.addEventListener('focusout', () => setTimeout(calc, 120));
})();

// 점검용: 지금 박 위치·BPM 읽기 (화면에는 영향 없음)
// 재생 화면에서 처음 화면을 만지는 순간 오디오를 미리 깨워 둠 → 첫 시작도 바로 (다른 앱 음악을 끊지 않게 재생 화면에서만)
document.addEventListener('pointerdown', () => { if (!$('#scrPlay').hidden && !E.ctx) ensureCtx(); }, true);
window.__countin = {beat:() => beatNow(), bpm:() => P.bpm, offset:() => SY.offset, rtt:() => SY.rtt};

/* ================= 시작 ================= */
layout(); renderHome(); show('home');
if (location.hash.startsWith('#c=')) setTimeout(() => handleConti(location.hash), 300);
history.replaceState({s:'home'}, '');
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && !window.Capacitor) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
